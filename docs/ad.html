<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  .ad-wrap {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* AdSense responsive unit fills the container */
  .adsbygoogle {
    display: block;
    width: 100%;
  }
</style>
<!-- STEP 1: Replace ca-pub-XXXXXXXXXXXXXXXX with your AdSense publisher ID -->
<!-- Get it at: https://adsense.google.com → Account → Publisher ID         -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
</head>
<body>
<div class="ad-wrap">
  <!-- STEP 2: Replace data-ad-slot with your AdSense ad unit slot ID -->
  <!-- Create a "Display ad" unit at: AdSense → Ads → By ad unit → Display ads -->
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
       data-ad-slot="XXXXXXXXXX"
       data-ad-format="horizontal"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>
</body>
</html>
