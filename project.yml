name: Recall
options:
  bundleIdPrefix: com.neelverma
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.neelverma.Recall
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  Recall:
    type: application
    platform: macOS
    sources:
      - path: Recall
        excludes:
          - "**/*.plist"
          - "**/*.entitlements"
    info:
      path: Recall/Info.plist
      properties:
        LSUIElement: true
        NSPrincipalClass: NSApplication
        CFBundleDisplayName: Recall
    entitlements:
      path: Recall/Recall.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_NAME: Recall
        INFOPLIST_FILE: Recall/Info.plist
        CODE_SIGN_ENTITLEMENTS: Recall/Recall.entitlements
        COMBINE_HIDPI_IMAGES: YES
